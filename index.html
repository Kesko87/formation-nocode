/* Mise en page : barre latérale sur ordinateur, barre d'onglets en bas sur téléphone.
   Couleurs : bitume bleuté, bleu panneau routier, ambre pour « à revoir ». */
:root {
  --bg: #f1f4f7;
  --surface: #ffffff;
  --surface-2: #e8edf2;
  --ink: #13202c;
  --muted: #566878;
  --line: #d5dde5;
  --accent: #1c5dcf;
  --accent-ink: #ffffff;
  --accent-soft: #dde8fb;
  --ok: #1b7a4b;
  --ok-soft: #dff3e8;
  --warn: #8a5a00;
  --warn-soft: #fcefcd;
  --road: #2b3947;
  --road-line: #f2c14e;
  --shadow: 0 1px 2px rgba(19, 32, 44, .06), 0 4px 14px rgba(19, 32, 44, .05);
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Avenir Next", Avenir, "Trebuchet MS", system-ui, -apple-system, sans-serif;
  --radius: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --surface: #17212b; --surface-2: #202c38; --ink: #e8eef3; --muted: #9db0bf;
    --line: #2a3845; --accent: #7aaaff; --accent-ink: #0a1830; --accent-soft: #1e3150;
    --ok: #62d097; --ok-soft: #173326; --warn: #f0bd59; --warn-soft: #3a2d10;
    --road: #0a1016; --road-line: #f2c14e; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #17212b; --surface-2: #202c38; --ink: #e8eef3; --muted: #9db0bf;
  --line: #2a3845; --accent: #7aaaff; --accent-ink: #0a1830; --accent-soft: #1e3150;
  --ok: #62d097; --ok-soft: #173326; --warn: #f0bd59; --warn-soft: #3a2d10;
  --road: #0a1016; --road-line: #f2c14e; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px));
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-head); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 1.7rem; letter-spacing: -.01em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 880px; margin: 0 auto; min-width: 0; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 6px; }
.brand { font-family: var(--font-head); font-weight: 800; font-size: 1.05rem; letter-spacing: -.01em; }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: .78rem; font-family: var(--font-body); }
main { display: grid; gap: 16px; padding-top: 10px; min-width: 0; }
.view-head { display: grid; gap: 4px; padding: 8px 0 4px; }
.view-head p { color: var(--muted); }

/* navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: space-around; padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.nav button { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .72rem; border-radius: 10px; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.nav button[aria-current="page"] svg { stroke-width: 2.4; }
@media (min-width: 900px) {
  body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-bottom: 48px; }
  .app { max-width: 1100px; display: grid; grid-template-columns: 210px minmax(0, 1fr); column-gap: 28px; align-items: start; }
  .topbar { grid-column: 1 / -1; }
  .nav { position: sticky; top: 16px; grid-column: 1; grid-row: 2; flex-direction: column; justify-content: flex-start; gap: 4px; background: none; border: 0; padding: 0; }
  .nav button { grid-template-columns: 24px 1fr; justify-items: start; align-items: center; gap: 12px; font-size: .95rem; padding: 10px 12px; text-align: left; }
  .nav button[aria-current="page"] { background: var(--accent-soft); }
  main { grid-column: 2; grid-row: 2; }
}

/* composants */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; display: grid; gap: 12px; }
.card.flat { box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-width: 0; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 12px; cursor: pointer; font-weight: 600; min-height: 44px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.big { font-size: 1.1rem; padding: 14px 22px; min-height: 52px; }
.btn.ghost { background: none; border-color: transparent; color: var(--accent); }
.btn.danger { color: #b3261e; }
:root[data-theme="dark"] .btn.danger { color: #ff8f86; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.cours { background: var(--accent-soft); color: var(--accent); }
.pill.fini { background: var(--ok-soft); color: var(--ok); }
.pill.revoir { background: var(--warn-soft); color: var(--warn); }
.pill.prep { background: transparent; border: 1px dashed var(--line); }
label { font-weight: 600; font-size: .92rem; }
input[type="text"], input[type="number"], input[type="date"], input[type="url"], select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.field { display: grid; gap: 6px; min-width: 0; }
.form { display: grid; gap: 12px; }

/* route : barre d'avancement façon marquage au sol */
.road { position: relative; height: 18px; border-radius: 9px; background: var(--road); overflow: hidden; }
.road::before { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 0; border-top: 2px dashed rgba(255,255,255,.28); transform: translateY(-1px); }
.road > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 9px; min-width: 0; }
.road > i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; border-top: 2px dashed var(--road-line); transform: translateY(-1px); }
.big-num { font-family: var(--font-head); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* tableau de bord */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.hero h1 { font-size: 1.5rem; }
.next { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
.next b { color: var(--accent); }
.welcome { border: 1px dashed var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--surface); display: grid; gap: 8px; }

/* listes */
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.item { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); min-width: 0; }
.item .t { min-width: 0; display: grid; gap: 2px; }
.item .t b { overflow-wrap: anywhere; }
.item.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.week-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding-top: 8px; }
details.module { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.module > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: grid; gap: 6px; }
details.module > summary::-webkit-details-marker { display: none; }
details.module[open] > summary { border-bottom: 1px solid var(--line); }
.module-body { padding: 14px 18px 18px; display: grid; gap: 10px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* séance */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.check:last-child { border-bottom: 0; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.check.done span { color: var(--muted); text-decoration: line-through; }
.course h3 { margin-top: 6px; }
.course p { max-width: 68ch; }
.promptbox { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: .93rem; white-space: pre-wrap; overflow-wrap: anywhere; }
details.qa { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--bg); }
details.qa summary { cursor: pointer; font-weight: 600; }
details.qa p { margin-top: 8px; color: var(--muted); }
.choices { display: grid; gap: 8px; }
.choice { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--surface); min-height: 48px; }
.choice input { accent-color: var(--accent); width: 20px; height: 20px; }
.back { align-self: start; }
.mastery { display: flex; gap: 4px; flex-wrap: wrap; }
.mastery button { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .85rem; min-height: 36px; }
.mastery button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
pre.json { margin: 0; max-height: 220px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: .78rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; z-index: 40; font-weight: 600; max-width: calc(100% - 32px); text-align: center; }
.banner { padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.timer { font-family: var(--font-head); font-size: 1.8rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }
@media (prefers-reduced-motion: no-preference) {
  .road > i { transition: width .5s ease; }
}

/* ===== Stockage =====
   Toute la lecture/écriture passe par Store. Plus tard, on pourra remplacer
   Store par une version qui parle à un compte en ligne, sans toucher au reste. */
const KEY = "pbn.formation.v1";
const Store = {
  mem: null, ok: true,
  load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { this.ok = false; }
    return this.mem;
  },
  save(state) {
    this.mem = state;
    try { localStorage.setItem(KEY, JSON.stringify(state)); this.ok = true; } catch (e) { this.ok = false; }
  }
};
function freshState() {
  return { v: 1, createdAt: new Date().toISOString(), settings: { theme: "auto", goalMin: 360 }, progress: {}, plan: {}, custom: [],
    timeLog: [], reviews: [], deliverables: {}, mastery: {}, weekly: {}, timer: null, lastExport: null, lastActive: null };
}
let S = Store.load() || freshState();
function fillDefaults(s) { const f = freshState(); for (const k in f) if (s[k] === undefined) s[k] = f[k]; return s; }
S = fillDefaults(S);
let saveT = null;
function save() { S.lastActive = new Date().toISOString(); clearTimeout(saveT); saveT = setTimeout(() => Store.save(S), 150); }
function saveNow() { S.lastActive = new Date().toISOString(); Store.save(S); }
window.addEventListener("pagehide", () => Store.save(S));

/* ===== Utilitaires ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const dayKey = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
function mondayKey(d = new Date()) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return dayKey(x); }
function fmtMin(m) { m = Math.round(m); if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return h + " h" + (r ? " " + pad(r) : ""); }
function fmtDate(iso) { try { return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); } catch (e) { return iso; } }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ===== Programme fusionné (programme de base + séances personnelles + planning modifié) ===== */
function allSessions() {
  const base = PROGRAM.sessions.map(s => Object.assign({}, s));
  const extra = (S.custom || []).map(s => Object.assign({ kind: "Perso", c: [], course: [], resources: [], criteria: [], questions: [], custom: true }, s));
  return base.concat(extra).map(s => { s.week = S.plan[s.id] != null ? S.plan[s.id] : s.w; return s; })
    .sort((a, b) => a.week - b.week || (a.o ?? 99) - (b.o ?? 99));
}
const sessionById = id => allSessions().find(s => s.id === id);
const prog = id => S.progress[id] || (S.progress[id] = { status: "a_commencer", tasks: {}, notes: "", links: [], understanding: null, finishedAt: null });
const statusOf = id => (S.progress[id] && S.progress[id].status) || "a_commencer";
const weekInfo = n => PROGRAM.weeks.find(w => w.n === n);
const moduleOf = id => PROGRAM.modules.find(m => m.id === id);
const moduleOfWeek = n => { const w = weekInfo(n); return w ? moduleOf(w.m) : null; };

function currentSession() {
  const all = allSessions();
  return all.find(s => statusOf(s.id) === "en_cours") || all.find(s => statusOf(s.id) === "a_commencer") || all.find(s => statusOf(s.id) === "a_revoir") || null;
}
function globalProgress() {
  const all = allSessions(); let total = 0, done = 0, nDone = 0;
  all.forEach(s => { total += s.min; if (statusOf(s.id) === "termine") { done += s.min; nDone++; } });
  return { pct: total ? Math.round(done / total * 100) : 0, nDone, n: all.length, done, total };
}
function minutesThisWeek() {
  const mk = mondayKey(); let m = 0;
  S.timeLog.forEach(e => { if (mondayKey(new Date(e.date + "T12:00:00")) === mk) m += e.min; });
  return m;
}
function nextTask(s) { const p = prog(s.id); const i = (s.tasks || []).findIndex((t, k) => !p.tasks[k]); return i >= 0 ? s.tasks[i] : null; }
function daysSinceActive() { if (!S.lastActive) return null; return Math.floor((Date.now() - new Date(S.lastActive).getTime()) / 86400000); }

function statusPill(id) {
  const s = statusOf(id); const cls = { en_cours: "cours", termine: "fini", a_revoir: "revoir", a_commencer: "" }[s];

function road(pct) { return '<div class="road" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" aria-label="Avancement"><i style="width:' + Math.max(pct, 2) + '%"></i></div>'; }

  html += '<div class="grid2"><section class="card"><h2>Avancement global</h2><div class="row between"><span class="big-num">' + g.pct + ' %</span><span class="muted small">' + g.nDone + " séance" + (g.nDone > 1 ? "s" : "") + " terminée" + (g.nDone > 1 ? "s" : "") + " sur " + g.n + "</span></div>" + road(g.pct) +

  if (s.c && s.c.length) html += '<section class="card flat"><h3>Compétences travaillées</h3><p class="muted small">' + s.c.map(id => id + " " + (PROGRAM.competences.find(c => c.id === id) || { t: "" }).t.split(" ").slice(0, 7).join(" ") + "…").map(esc).join("<br>") + '</p><p class="small">Terminer la séance ne valide pas ces compétences. <a href="#" data-go="projet" data-tab="comp">Les évaluer</a></p></section>';

  if (s.custom) html += '<div><button class="btn ghost danger" data-act="del-custom">Supprimer cette séance personnelle</button></div>';
  return html;
}
function finishForm(s) {

function clock(ms) { const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return (h ? pad(h) + ":" : "") + pad(m) + ":" + pad(r); }

/* ===== Actions ===== */
function openSession(id) { route = { name: "seance", id }; const p = prog(id); if (p.status === "a_commencer") { p.status = "en_cours"; save(); } render(); window.scrollTo(0, 0); }
function finishSession() {
  const s = sessionById(route.id); const p = prog(s.id);
  const und = document.querySelector('input[name="und"]:checked');
  if (!und) { toast("Choisis comment s'est passée la compréhension."); return; }
  p.understanding = +und.value; p.finishedAt = new Date().toISOString();
  const m = parseInt($("#f-min").value, 10);
  if (m > 0) S.timeLog.push({ id: uid(), date: dayKey(), min: m, sessionId: s.id, note: s.title });
  if (p.understanding === 1) { p.status = "a_revoir"; addReview(s.title, "Compréhension à consolider", s.id); toast("Séance enregistrée et ajoutée à tes révisions."); }
  else { p.status = "termine"; if (p.understanding === 2) addReview(s.title, "Compris en partie", s.id); toast("Séance terminée."); }
  saveNow(); render(); window.scrollTo(0, 0);
}
function addReview(topic, note, sessionId) { if (!S.reviews.some(r => !r.done && r.sessionId === sessionId && r.topic === topic)) S.reviews.push({ id: uid(), topic, note, sessionId: sessionId || null, done: false, at: new Date().toISOString() }); }
function exportData() {
  S.lastExport = new Date().toISOString(); saveNow();
  return JSON.stringify({ app: "formation-product-builder", exportedAt: S.lastExport, data: S }, null, 2);
}
function downloadJSON() {
  const txt = exportData(); const name = "formation-sauvegarde-" + dayKey() + ".json";
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) {}
  const area = $("#export-area"); if (area) { area.hidden = false; $("#exp").value = txt; }
  toast("Export prêt. Si aucun fichier n'apparaît, copie le texte affiché.");
  const info = document.querySelector("#view .small.muted"); if (info) render_keep();
}
function render_keep() { /* garde l'affichage, met à jour la date d'export plus tard */ }
function importJSON(text) {
  const msg = $("#imp-msg"); let obj;
  try { obj = JSON.parse(text); } catch (e) { msg.textContent = "Ce texte n'est pas un JSON valide. Rien n'a été modifié."; return; }
  const d = obj && obj.data ? obj.data : obj;
  if (!d || typeof d !== "object" || typeof d.progress !== "object" || !Array.isArray(d.timeLog)) { msg.textContent = "Ce fichier ne ressemble pas à une sauvegarde de cette application. Rien n'a été modifié."; return; }
  const backup = JSON.stringify(S);
  S = fillDefaults(d); saveNow();
  msg.textContent = "Import réussi. " + Object.keys(S.progress).length + " séance(s) avec progression.";
  window.__lastBackup = backup; render(); toast("Données importées.");
}

/* ===== Événements ===== */
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button, a, summary"); if (!t) return;
  if (t.dataset.go) { ev.preventDefault(); if (t.dataset.tab) viewOpts.projet.tab = t.dataset.tab; go(t.dataset.go); return; }
  if (t.dataset.open) { openSession(t.dataset.open); return; }
  if (t.dataset.rtab) { viewOpts.revisions.tab = t.dataset.rtab; render(); return; }
  if (t.dataset.ptab) { viewOpts.projet.tab = t.dataset.ptab; render(); return; }
  if (t.dataset.revdone) { const r = S.reviews.find(x => x.id === t.dataset.revdone); if (r) r.done = true; save(); render(); return; }
  if (t.dataset.revundo) { const r = S.reviews.find(x => x.id === t.dataset.revundo); if (r) r.done = false; save(); render(); return; }
  if (t.dataset.dellink != null && t.dataset.dellink !== "") { prog(route.id).links.splice(+t.dataset.dellink, 1); save(); render(); return; }
  if (t.dataset.dellog) { S.timeLog = S.timeLog.filter(e => e.id !== t.dataset.dellog); save(); render(); return; }
  if (t.dataset.mastery) { const [id, k] = t.dataset.mastery.split(":"); if (S.mastery[id] === k) delete S.mastery[id]; else S.mastery[id] = k; save(); render(); return; }
  if (t.dataset.copy) { const el = document.getElementById(t.dataset.copy); try { await navigator.clipboard.writeText(el.textContent); toast("Copié."); } catch (e) { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Sélectionné : fais Copier avec ton clavier."); } return; }
  const a = t.dataset.act; if (!a) return;
  if (a === "finish") finishSession();
  else if (a === "reopen") { const p = prog(route.id); p.status = "en_cours"; p.finishedAt = null; save(); render(); }
  else if (a === "mark-review") { const s = sessionById(route.id); prog(s.id).status = "a_revoir"; addReview(s.title, "Marquée à revoir", s.id); save(); render(); }
  else if (a === "reprise") { viewOpts.revisions.tab = "reprise"; go("revisions"); }
  else if (a === "reset-plan") { S.plan = {}; save(); render(); toast("Planning d'origine rétabli."); }
  else if (a === "del-custom") { S.custom = S.custom.filter(c => c.id !== route.id); delete S.progress[route.id]; delete S.plan[route.id]; save(); go("parcours"); }
  else if (a === "timer-start") { S.timer = { startedAt: Date.now() }; saveNow(); render(); }
  else if (a === "timer-stop") { const m = Math.max(1, Math.round((Date.now() - S.timer.startedAt) / 60000)); S.timeLog.push({ id: uid(), date: dayKey(), min: m, note: "Chronomètre" }); S.timer = null; saveNow(); render(); toast(fmtMin(m) + " enregistrées."); }
  else if (a === "export" || a === "show-json") { if (a === "export") downloadJSON(); else { const ar = $("#export-area"); ar.hidden = false; $("#exp").value = exportData(); } }
  else if (a === "copy-json") { try { await navigator.clipboard.writeText($("#exp").value); toast("Copié."); } catch (e) { $("#exp").select(); toast("Sélectionné : copie avec ton clavier."); } }
  else if (a === "import-text") { const v = $("#imp-t").value.trim(); if (!v) { $("#imp-msg").textContent = "Colle d'abord le texte JSON."; return; } importJSON(v); }
  else if (a === "copy-portfolio") {
    const txt = PROGRAM.deliverables.filter(d => (S.deliverables[d.id] || {}).status === "fait").map(d => { const x = S.deliverables[d.id]; return "- " + d.t + (x.link ? " : " + x.link : "") + (x.desc ? "\n  " + x.desc : ""); }).join("\n") || "(aucun livrable terminé)";
    try { await navigator.clipboard.writeText(txt); toast("Portfolio copié."); } catch (e) { toast("Copie impossible ici."); }
  }
  else if (a === "reset-ask") { $("#reset-zone").innerHTML = '<p><b>Effacer toutes tes données ?</b> Exporte d\'abord si tu veux les garder.</p><div class="row"><button class="btn danger" data-act="reset-yes">Oui, tout effacer</button><button class="btn" data-act="reset-no">Annuler</button></div>'; }
  else if (a === "reset-no") render();
  else if (a === "reset-yes") { S = freshState(); saveNow(); go("home"); toast("Données effacées."); }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.task != null && t.dataset.task !== "") { const p = prog(route.id); p.tasks[t.dataset.task] = t.checked; if (p.status === "a_commencer") p.status = "en_cours"; save(); t.closest(".check").classList.toggle("done", t.checked); }
  else if (t.dataset.move) { const w = +t.value; const s = PROGRAM.sessions.find(x => x.id === t.dataset.move); if (s && s.w === w) delete S.plan[s.id]; else S.plan[t.dataset.move] = w; save(); viewOpts.parcours.open = moduleOfWeek(w) && moduleOfWeek(w).id; render(); toast("Séance déplacée en semaine " + w + "."); }
  else if (t.dataset.dstatus) { (S.deliverables[t.dataset.dstatus] = S.deliverables[t.dataset.dstatus] || { status: "a_faire", link: "", desc: "", skills: [] }).status = t.value; save(); }
  else if (t.id === "s-th") { S.settings.theme = t.value; save(); applyTheme(); }
  else if (t.id === "s-g") { S.settings.goalMin = Math.max(30, +t.value || 360); save(); }
  else if (t.id === "imp-f" && t.files[0]) { const fr = new FileReader(); fr.onload = () => importJSON(String(fr.result)); fr.readAsText(t.files[0]); }
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "notes") { prog(route.id).notes = t.value; if (statusOf(route.id) === "a_commencer") prog(route.id).status = "en_cours"; save(); }
  else if (t.dataset.dlink) { (S.deliverables[t.dataset.dlink] = S.deliverables[t.dataset.dlink] || { status: "a_faire", link: "", desc: "", skills: [] }).link = t.value; save(); }
  else if (t.dataset.ddesc) { (S.deliverables[t.dataset.ddesc] = S.deliverables[t.dataset.ddesc] || { status: "a_faire", link: "", desc: "", skills: [] }).desc = t.value; save(); }
  else if (t.dataset.week) { const mk = mondayKey(); (S.weekly[mk] = S.weekly[mk] || { learned: "", hard: "", next: "" })[t.dataset.week] = t.value; save(); }
});
document.addEventListener("submit", (ev) => {
  ev.preventDefault(); const f = ev.target.id;
  if (f === "f-link") { const u = $("#l-u").value.trim(); if (!u) return; prog(route.id).links.push({ label: $("#l-l").value.trim(), url: u }); save(); render(); }
  else if (f === "f-diff") { addReview($("#d-t").value.trim(), $("#d-n").value.trim(), null); save(); render(); toast("Ajouté à ta liste."); }
  else if (f === "f-time") { const m = parseInt($("#t-m").value, 10); if (!(m > 0)) return; S.timeLog.push({ id: uid(), date: $("#t-d").value || dayKey(), min: m, note: $("#t-n").value.trim() }); save(); render(); toast("Temps ajouté."); }
  else if (f === "f-custom") { const id = "x" + uid(); const w = +$("#cu-w").value; S.custom.push({ id, w, o: 50, title: $("#cu-t").value.trim(), min: +$("#cu-m").value || 60, goal: $("#cu-g").value.trim(), tasks: [], deliverable: "" }); viewOpts.parcours.open = moduleOfWeek(w).id; save(); render(); toast("Séance ajoutée en semaine " + w + "."); }
});
document.addEventListener("toggle", (ev) => { const d = ev.target; if (d.matches && d.matches("details.module")) { if (d.open) viewOpts.parcours.open = d.dataset.mod; } }, true);
function afterRender() { if (S.timer && $("#timer")) tick(); }
let tickT = null;
function tick() { clearInterval(tickT); tickT = setInterval(() => { const el = $("#timer"); if (!el || !S.timer) { clearInterval(tickT); return; } el.textContent = clock(Date.now() - S.timer.startedAt); }, 1000); }

/* ===== Démarrage ===== */
document.getElementById("theme-btn").addEventListener("click", () => { const order = ["auto", "light", "dark"]; S.settings.theme = order[(order.indexOf(S.settings.theme) + 1) % 3]; save(); applyTheme(); toast("Thème : " + { auto: "automatique", light: "clair", dark: "sombre" }[S.settings.theme]); });
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
render();

</script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
